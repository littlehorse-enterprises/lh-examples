apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pod
  labels:
    app: worker-pod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-pod
  template:
    metadata:
      labels:
        app: worker-pod
    spec:
      containers:
      - name: worker-pod
        image: ghcr.io/littlehorse-enterprises/lh-examples/example-worker-pod:latest
        env:
        - name: LHC_API_HOST
          value: "quickstart-server"
        - name: LHC_API_PORT
          value: "2024"
